<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="5; url=/">
    <script type="text/javascript">
        setTimeout(function() {
            window.location.href = "/";
        }, 5000);
    </script>
    <title>Cardápio em Atualização - Seu Juca</title>
    <style>
        :root {
            --primary-color: #ffc107;
            --bg-color: #121212;
            --text-color: #ffffff;
            --text-muted: #888888;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 450px;
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            width: 180px;
            height: auto;
            margin-bottom: 40px;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 15px;
            letter-spacing: -0.02em;
            color: var(--primary-color);
        }
        .subtitle {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 20px;
        }
        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .icon-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
        }
        .icon {
            width: 100%;
            height: 100%;
            border: 3px solid rgba(255, 193, 7, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }
        .btn-home {
            display: inline-block;
            background-color: var(--primary-color);
            color: #000;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.3);
        }
        .btn-home:hover {
            background-color: #ffca2c;
            transform: translateY(-2px);
        }
        .btn-home:active {
            transform: scale(0.96);
        }
        .footer-text {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #444;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="./assets/img/logo-seujuca.webp" alt="Logo Seu Juca" class="logo">
        
        <div class="icon-container">
            <div class="icon">⚙️</div>
        </div>
        
        <h1>Cardápio em Atualização</h1>
        <p class="subtitle">Estamos trabalhando para trazer novas opções!</p>
        <p>Em breve nosso cardápio estará de volta com muitas novidades. Pedimos desculpas pelo inconvenience e agradecemos a paciência.</p>
        
        <a href="/" class="btn-home">VOLTAR PARA HOME</a>
        
        <div class="footer-text">
            Seu Juca | Bar e Restaurante
        </div>
    </div>
</body>
</html>
